name: Swap functional tests

on:
  workflow_dispatch:
  push:
    branches:
    - master
    - develop
  pull_request:

jobs:
  job_functional_tests:
    uses: ./.github/workflows/_reusable_swap_functional_tests.yml
    with:
      repo_for_bitcoin: ${{ github.repository }}
      branch_for_bitcoin: ${{ github.ref }}
      test_filter: '"btc or bitcoin or Bitcoin"'
